name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_source.py
      - name: Bash syntax
        shell: bash
        run: |
          bash -n scripts/install-wsl.sh
          bash -n scripts/bootstrap-wsl.sh
      - name: PowerShell syntax (no installer execution)
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          Get-ChildItem scripts,tests -Filter *.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Guided installer offline tests
        shell: pwsh
        run: ./tests/test_setup_windows.ps1
      - name: Windows PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          Get-ChildItem scripts,tests -Filter *.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Guided installer Windows PowerShell 5.1 tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_setup_windows.ps1
